# ポスター管理アプリを Firebase Hosting へ配信する。
#
# GitHub Pages を使わない理由は docs/requirements.md 3.2 を参照。
# 要点: iOS では配信元と authDomain のドメインが一致していないと
# Google ログインが完了しない。

name: ポスター管理アプリのデプロイ

on:
  push:
    branches: [main]
    paths:
      - 'poster-app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 同じブランチのデプロイが重ならないようにする
concurrency:
  group: poster-app-deploy
  cancel-in-progress: true

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: テストを実行する
        working-directory: poster-app
        run: npm test

  deploy:
    name: 配信
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 接続設定はリポジトリに置かず、ここで組み立てる
      - name: Firebase の接続設定を生成する
        working-directory: poster-app
        env:
          WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: |
          if [ -z "$WEB_CONFIG" ]; then
            echo "::error::シークレット FIREBASE_WEB_CONFIG が設定されていません"
            exit 1
          fi
          printf 'export const firebaseConfig = %s;\n' "$WEB_CONFIG" \
            > public/js/firebase-config.js

          # 値そのものを検査する。
          # 「項目があるか」だけを見ていたため、apiKey に伏せ字（•）が
          # 混入したまま配信し、auth/api-key-not-valid で気付いた経緯がある。
          # 画面に伏せ字で表示された値をコピーして登録すると起こる。
          # 配信してから実機で気付くのでは遅い。ここで止める。
          node --input-type=module \
            -e "import('./public/js/firebase-config.js').then(m => {
                  const c = m.firebaseConfig;
                  const need = ['apiKey', 'authDomain', 'projectId', 'appId'];
                  const fail = (msg) => { console.error('::error::' + msg); process.exit(1); };

                  for (const k of need) {
                    if (!c?.[k]) fail('接続設定に ' + k + ' がありません');
                  }

                  // 伏せ字・全角・空白の混入を捕まえる。
                  // ASCII の印字可能文字だけで構成されているはず
                  for (const [k, v] of Object.entries(c)) {
                    if (typeof v !== 'string') continue;
                    if (!/^[\x21-\x7e]+$/.test(v)) {
                      fail(k + ' に使えない文字が入っています（伏せ字や全角が混じっていませんか）');
                    }
                  }

                  // Firebase の API キーは AIza で始まる39文字
                  if (!/^AIza[0-9A-Za-z_-]{35}$/.test(c.apiKey)) {
                    fail('apiKey の形が違います（' + c.apiKey.length + '文字。正しくは39文字）');
                  }

                  console.log('接続設定を確認しました authDomain:', c.authDomain);
                })"

      - name: 認証情報を書き出す
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::シークレット FIREBASE_SERVICE_ACCOUNT が設定されていません"
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"

      - name: Hosting とセキュリティルールを配信する
        working-directory: poster-app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting,firestore:rules \
            --project "$PROJECT_ID" \
            --non-interactive

      - name: 認証情報を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
